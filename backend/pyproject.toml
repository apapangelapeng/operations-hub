[project]
name = "operations-hub-api"
version = "0.1.0"
description = "Unified operations API for KYC, refunds, and feature flags"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.31",
    "psycopg2-binary==2.9.9",
    "pydantic==2.8.2",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "pytest==8.2.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
