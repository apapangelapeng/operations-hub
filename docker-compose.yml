services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operations_hub
      POSTGRES_USER: operations_hub
      POSTGRES_PASSWORD: operations_hub
    volumes:
      - operations_hub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      AUTH_MODE: ${AUTH_MODE:-demo}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+psycopg2://operations_hub:operations_hub@db:5432/operations_hub
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  operations_hub_data:
